<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Blog Explorer</title>
  <link rel="stylesheet" href="styles/main.css">
</head>
<body>
  <header class="site-header">
    <h1 class="site-header__title">Blog Explorer</h1>
    <form class="search" role="search">
      <input class="search__input" type="search" placeholder="Search posts…" aria-label="Search posts">
    </form>
  </header>

  <main class="layout">
    <p class="status" role="status">Loading…</p>
    <section class="posts" aria-label="Posts"></section>
  </main>

  <dialog class="dialog">
    <button class="dialog__close" type="button" aria-label="Close">✕</button>
    <h2 class="dialog__title"></h2>
    <p class="dialog__author"></p>
    <p class="dialog__body"></p>
    <h3 class="dialog__heading">Comments</h3>
    <ul class="dialog__comments"></ul>
  </dialog>

  <script type="module" src="src/main.js"></script>
</body>
</html>
